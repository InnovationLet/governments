title: "InnovationLet Governments"
short_title: "Governments"
tagline: "Regulation and public technology, explained."
description: >-
  InnovationLet Governments covers regulation, public digital services
  and the policy that sets the rules for technology. Independent
  reporting and analysis from the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/governments"
main_site: "https://innovationlet.github.io"

category_name: "Governments"
category_meta: "Regulation · Public tech · Policy"
accent: "red"
hero_title: "How governments shape technology."
hero_lead: >-
  Regulation, public digital services and the policy that quietly sets
  the rules everyone else has to build against.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
